# Add this to your Nav2 params so the local costmap consumes the hazard cloud.
# Topic: /rock_detection_node/hazard_points (sensor_msgs/PointCloud2, frame base_link)
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["voxel_layer", "hazard_layer", "inflation_layer"]
      hazard_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: rock_hazards
        rock_hazards:
          topic: /rock_detection_node/hazard_points
          data_type: "PointCloud2"
          sensor_frame: base_link
          marking: True
          clearing: True        # empty clouds published by the node clear stale hazards
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          min_obstacle_height: -0.1
          max_obstacle_height: 0.5
          observation_persistence: 1.0
          expected_update_rate: 0.0
